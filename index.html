<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Жизнь при ИИ</title>
<meta name="description" content="Сообщество людей, которые учатся жить и работать рядом с ИИ. Онлайн и офлайн в Берлине.">
<style>
  :root {
    --bg: #faf8f4;
    --fg: #1d1d1f;
    --muted: #6b6b70;
    --accent: #d9480f;
    --line: #e6e2da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414;
      --fg: #f2efe9;
      --muted: #9a9aa0;
      --accent: #ff8a5b;
      --line: #2a2a2a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  main { max-width: 560px; width: 100%; }
  .tag {
    display: inline-block;
    font-size: 13px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 20px;
  }
  h1 {
    font-size: clamp(36px, 9vw, 56px);
    line-height: 1.05;
    margin: 0 0 20px;
    letter-spacing: -0.02em;
  }
  p { font-size: 18px; margin: 0 0 16px; }
  .muted { color: var(--muted); }
  .formats {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 28px 0;
    padding: 0;
    list-style: none;
  }
  .formats li {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 15px;
  }
  footer { margin-top: 40px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <span class="tag">Скоро</span>
  <h1>Жизнь при ИИ</h1>
  <p>Сообщество людей, которые учатся жить и работать рядом с искусственным интеллектом: делятся опытом, пробуют, спорят и поддерживают друг друга.</p>
  <ul class="formats">
    <li>Онлайн</li>
    <li>Офлайн в Берлине</li>
  </ul>
  <p class="muted">Страница в разработке. Совсем скоро здесь появятся подробности и способ присоединиться.</p>
  <footer>© 2026</footer>
</main>
</body>
</html>
